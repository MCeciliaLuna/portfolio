  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

tyle=\"display:flex;flex-direction:column;gap:6px;\">\n          <label style=\"font-family:'Caveat',cursive;font-size:24px;color:#7a0062;\">Nombre<\u002Flabel>\n          <input name=\"nombre\" type=\"text\" placeholder=\"Tu nombre completo\" style=\"border:none;border-bottom:1.5px solid rgba(0,0,0,.2);border-radius:0;background:transparent;padding:8px 2px;font-size:18px;transition:border-color .3s;\" style-focus=\"border-bottom-color:#f50062;\">\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;\">\n          <label style=\"font-family:'Caveat',cursive;font-size:24px;color:#7a0062;\">Email<\u002Flabel>\n          <input name=\"email\" type=\"email\" placeholder=\"tu@email.com\" style=\"border:none;border-bottom:1.5px solid rgba(0,0,0,.2);border-radius:0;background:transparent;padding:8px 2px;font-size:18px;transition:border-color .3s;\" style-focus=\"border-bottom-color:#f50062;\">\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;\">\n          <label style=\"font-family:'Caveat',cursive;font-size:24px;color:#7a0062;\">Mensaje<\u002Flabel>\n          <textarea name=\"mensaje\" data-msg=\"\" maxlength=\"500\" rows=\"4\" placeholder=\"Contame sobre tu proyecto…\" style=\"border:none;border-bottom:1.5px solid rgba(0,0,0,.2);border-radius:0;background:transparent;padding:8px 2px;font-size:18px;resize:vertical;transition:border-color .3s;\" style-focus=\"border-bottom-color:#f50062;\"><\u002Ftextarea>\n          <span data-counter=\"\" style=\"align-self:flex-end;font-size:13px;color:#9a9096;\">0 / 500<\u002Fspan>\n        <\u002Fdiv>\n        <button type=\"submit\" style=\"align-self:flex-start;padding:15px 36px;background:#f50062;color:#fff;border:none;border-radius:999px;font-size:17px;font-family:'Lora',serif;cursor:pointer;transition:background .3s,transform .3s,box-shadow .3s;box-shadow:0 8px 22px rgba(245,0,98,.28);\" style-hover=\"background:#7a0062;transform:translateY(-2px);box-shadow:0 12px 30px rgba(122,0,98,.36);\">Enviar mensaje →<\u002Fbutton>\n      <\u002Fform>\n      <div data-success=\"\" style=\"display:none;align-items:center;gap:12px;position:absolute;left:0;right:0;bottom:-64px;background:#c2cc00;color:#2a2d00;padding:16px 22px;border-radius:14px;font-size:16px;box-shadow:0 12px 30px rgba(194,204,0,.35);\">\n        <span style=\"font-family:'Caveat',cursive;font-size:26px;\">¡Gracias!<\u002Fspan> Tu mensaje fue enviado — te respondo pronto ✦\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"background:#4a003b;color:#f3d9ec;padding:64px 40px 40px;\">\n  <div style=\"max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:30px;\">\n    <div>\n      <p style=\"font-family:'Caveat',cursive;font-size:44px;font-weight:700;color:#fff;margin:0 0 4px;\">Cecilia Luna<\u002Fp>\n      <p style=\"font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:rgba(243,217,236,.7);margin:0;\">Frontend Developer &amp; UX/UI Designer<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:24px;font-size:15px;\">\n      <a href=\"https://www.linkedin.com/in/mcecilialuna1/\" target=\"_blank\" rel=\"noopener\" style=\"color:#f3d9ec;text-decoration:none;transition:color .3s;\" style-hover=\"color:#ffe15c;\">LinkedIn<\u002Fa>\n      <a href=\"https://github.com/MCeciliaLuna\" target=\"_blank\" rel=\"noopener\" style=\"color:#f3d9ec;text-decoration:none;transition:color .3s;\" style-hover=\"color:#ffe15c;\">GitHub<\u002Fa>\n      <a href=\"mailto:lunama.cecilia@live.com\" style=\"color:#f3d9ec;text-decoration:none;transition:color .3s;\" style-hover=\"color:#ffe15c;\">Email<\u002Fa>\n      <a href=\"https://wa.me/5493816427068\" target=\"_blank\" rel=\"noopener\" style=\"color:#f3d9ec;text-decoration:none;transition:color .3s;\" style-hover=\"color:#ffe15c;\">WhatsApp<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"max-width:1180px;margin:34px auto 0;padding-top:22px;border-top:1px solid rgba(255,255,255,.15);font-size:13px;color:rgba(243,217,236,.6);\">© 2026 María Cecilia Luna. Hecho con código y cariño.<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;heroVariant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;B&quot;,&quot;options&quot;:[&quot;A&quot;,&quot;B&quot;],&quot;tsType&quot;:&quot;'A'|'B'&quot;,&quot;section&quot;:&quot;Hero&quot;,&quot;label&quot;:&quot;Variante de Hero&quot;},&quot;revealAnimations&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Interacción&quot;,&quot;label&quot;:&quot;Animaciones al scroll&quot;},&quot;companiesMarquee&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Empresas&quot;,&quot;label&quot;:&quot;Empresas en carrusel&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const v = this.props.heroVariant || 'A';\n    const marquee = this.props.companiesMarquee !== false;\n    return {\n      heroA: v !== 'B',\n      heroB: v === 'B',\n      companiesMarquee: marquee,\n      companiesGrid: !marquee,\n    };\n  }\n  componentDidMount() { this._init(); }\n  componentDidUpdate() { this._init(); }\n  _init() {\n    this._setupReveal();\n    if (!this._wired) {\n      this._wired = true;\n      this._setupNav();\n      this._setupActive();\n      this._setupForm();\n      this._setupResponsive();\n    }\n  }\n  _setupReveal() {\n    const on = this.props.revealAnimations !== false;\n    const els = document.querySelectorAll('[data-reveal]');\n    if (!on) { els.forEach(el => { el.style.opacity = '1'; el.style.transform = 'none'; }); return; }\n    if (!this._io) {\n      this._io = new IntersectionObserver((ents) => {\n        ents.forEach(e => {\n          if (e.isIntersecting) { e.target.style.opacity = '1'; e.target.style.transform = 'none'; this._io.unobserve(e.target); }\n        });\n      }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });\n    }\n    els.forEach(el => {\n      if (el.__rev) return;\n      el.__rev = true;\n      const r = el.getBoundingClientRect();\n      const vis = r.top < window.innerHeight * 0.9;\n      const type = el.getAttribute('data-reveal');\n      el.style.transition = 'opacity .8s cubic-bezier(.22,1,.36,1), transform .8s cubic-bezier(.22,1,.36,1)';\n      el.style.transitionDelay = (el.getAttribute('data-delay') || 0) + 'ms';\n      if (vis) { el.style.opacity = '1'; el.style.transform = 'none'; }\n      else {\n        el.style.opacity = '0';\n        el.style.transform = type === 'left' ? 'translateX(-30px)' : type === 'right' ? 'translateX(30px)' : type === 'scale' ? 'scale(.94)' : 'translateY(30px)';\n        this._io.observe(el);\n      }\n    });\n  }\n  _setupNav() {\n    const nav = document.querySelector('[data-nav]');\n    if (!nav) return;\n    const onScroll = () => {\n      if (window.scrollY > 24) {\n        nav.style.background = 'rgba(251,249,244,.88)';\n        nav.style.backdropFilter = 'blur(12px)';\n        nav.style.webkitBackdropFilter = 'blur(12px)';\n        nav.style.boxShadow = '0 1px 0 rgba(0,0,0,.06)';\n      } else {\n        nav.style.background = 'transparent';\n        nav.style.backdropFilter = 'none';\n        nav.style.webkitBackdropFilter = 'none';\n        nav.style.boxShadow = 'none';\n      }\n    };\n    window.addEventListener('scroll', onScroll, { passive: true });\n    onScroll();\n  }\n  _setupActive() {\n    const links = [...document.querySelectorAll('[data-navlink]')];\n    const map = {};\n    links.forEach(a => { map[a.getAttribute('href')] = a; });\n    const io = new IntersectionObserver((ents) => {\n      ents.forEach(e => {\n        if (e.isIntersecting) {\n          links.forEach(l => { if (!l.dataset.cta) l.style.color = '#6b6169'; });\n          const a = map['#' + e.target.id];\n          if (a && !a.dataset.cta) a.style.color = '#7a0062';\n        }\n      });\n    }, { threshold: 0.55 });\n    document.querySelectorAll('section[id]').forEach(s => io.observe(s));\n  }\n  _setupResponsive() {\n    const nav = document.querySelector('[data-nav]');\n    const menu = document.querySelector('[data-menu]');\n    const burger = document.querySelector('[data-burger]');\n    if (!nav || !menu || !burger) return;\n    const apply = () => {\n      const narrow = window.innerWidth < 880;\n      burger.style.display = narrow ? 'flex' : 'none';\n      if (narrow) {\n        if (menu.getAttribute('data-open') !== '1') menu.style.display = 'none';\n        menu.style.position = 'absolute';\n        menu.style.top = '100%';\n        menu.style.right = '20px';\n        menu.style.flexDirection = 'column';\n        menu.style.alignItems = 'flex-start';\n        menu.style.gap = '16px';\n        menu.style.background = '#fff';\n        menu.style.padding = '20px 24px';\n        menu.style.borderRadius = '16px';\n        menu.style.boxShadow = '0 16px 40px rgba(0,0,0,.14)';\n      } else {\n        menu.style.display = 'flex';\n        menu.style.position = 'static';\n        menu.style.flexDirection = 'row';\n        menu.style.alignItems = 'center';\n        menu.style.gap = '30px';\n        menu.style.background = 'transparent';\n        menu.style.padding = '0';\n        menu.style.boxShadow = 'none';\n        menu.setAttribute('data-open', '0');\n      }\n    };\n    burger.addEventListener('click', () => {\n      const open = menu.getAttribute('data-open') === '1';\n      menu.setAttribute('data-open', open ? '0' : '1');\n      menu.style.display = open ? 'none' : 'flex';\n    });\n    document.querySelectorAll('[data-navlink]').forEach(a => a.addEventListener('click', () => {\n      if (window.innerWidth < 880) { menu.setAttribute('data-open', '0'); menu.style.display = 'none'; }\n    }));\n    window.addEventListener('resize', apply);\n    apply();\n  }\n  _setupForm() {\n    const form = document.querySelector('[data-form]');\n    if (!form) return;\n    const msg = form.querySelector('[data-msg]');\n    const counter = form.querySelector('[data-counter]');\n    const ok = document.querySelector('[data-success]');\n    if (msg && counter) msg.addEventListener('input', () => { counter.textContent = msg.value.length + ' / 500'; });\n    form.addEventListener('submit', (e) => {\n      e.preventDefault();\n      const n = form.querySelector('[name=nombre]');\n      const em = form.querySelector('[name=email]');\n      let valid = true;\n      [n, em, msg].forEach(f => {\n        if (f && !f.value.trim()) { f.style.borderColor = '#f50062'; valid = false; }\n        else if (f) { f.style.borderColor = 'rgba(0,0,0,.2)'; }\n      });\n      if (em && em.value.trim() && !/.+@.+\\..+/.test(em.value)) { em.style.borderColor = '#f50062'; valid = false; }\n      if (!valid) return;\n      if (ok) ok.style.display = 'flex';\n      form.reset();\n      if (counter) counter.textContent = '0 / 500';\n      clearTimeout(this._okT);\n      this._okT = setTimeout(() => { if (ok) ok.style.display = 'none'; }, 4500);\n    });\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
